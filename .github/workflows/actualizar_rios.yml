name: Actualizar ríos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r jobs/requirements.txt
      - name: Descargar trazado de ríos
        run: python jobs/descargar_rios.py
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BQ_TABLA_HIDRO: appsheetgr.BD_Procesamiento.senamhi_hidrologia
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/rios.geojson
          git diff --cached --quiet || git commit -m "Actualiza trazado de ríos"
          git push
